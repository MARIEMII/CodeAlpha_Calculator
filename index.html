<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-act="clear">AC</button>
    <button class="fn" data-act="del" aria-label="Delete">&#9003;</button>
    <button class="fn" data-act="percent">%</button>
    <button class="op" data-op="÷" aria-label="Divide">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="×" aria-label="Multiply">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="−" aria-label="Subtract">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+" aria-label="Add">+</button>

    <button data-num="0" class="zero">0</button>
    <button data-num=".">.</button>
    <button class="eq" data-act="equals" aria-label="Equals">=</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
